events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Re-resolving "api" every 10 s keeps the upstream
    # in step when the replicas are recreated (new image, Watchtower) and get
    # new addresses.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # One entry per api replica: NGINX spreads requests over them in turn.
    upstream api {
        zone api 64k;
        server api:8000 resolve;
    }

    # Login attempts per client address: slows down password guessing without
    # getting in the way of a real user or of the Airflow service account.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prometheus scrapes /metrics over the Docker network. It must not be
        # reachable from outside, so the proxy does not forward it.
        location = /metrics {
            return 404;
        }

        location = /token {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://api;
        }
    }
}
