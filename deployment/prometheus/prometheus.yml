# Prometheus configuration
# Scrape targets for the monitoring stack (see docker-compose.yml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape every API replica. "api" resolves to one address per replica on
  # the Docker network; a static target would reach only one of them and
  # miss the traffic the others serve.
  - job_name: 'ml-api'
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 8000
        refresh_interval: 15s
    metrics_path: '/metrics'

  # Results left by batch jobs (drift detection). honor_labels keeps the job
  # label the job pushed ("drift_detection") instead of "pushgateway".
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']