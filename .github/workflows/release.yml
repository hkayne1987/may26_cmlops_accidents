name: Publish images

# Runs once a change reaches main, so only reviewed code is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to the registry: no secret to create or rotate.
      packages: write

    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: training
            dockerfile: docker/train.Dockerfile
          - name: dvc
            dockerfile: docker/dvc.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Two tags: the commit SHA pins a build for good, latest follows main.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/baac-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/baac-${{ matrix.name }}:latest
          # One cache per image: without a scope the three images would
          # overwrite each other's cache. Same names as in ci.yml, so pull
          # requests can reuse the cache built here on main.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
