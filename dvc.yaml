stages:
  preprocess:
    cmd: python -m src.data.preprocess
    deps:
    - data/raw
    - src/data/preprocess.py
    outs:
    - data/processed
  # The trained model is versioned in the MLflow registry on DagsHub, not in
  # DVC: train.py registers it as xgb_severity and moves the production alias.
  # DVC only versions the data here.
  train:
    cmd: python -m src.training.train
    deps:
    - data/processed/train.parquet
    - src/training/train.py
  evaluate:
    cmd: python -m src.training.evaluate
    deps:
    - data/processed/test.parquet
    - src/training/evaluate.py