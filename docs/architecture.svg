<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1184 568" width="1184" height="568" role="img" aria-label="Technical architecture: GitHub and DagsHub on top, the developers' call-centre app on the left, and a Docker host running NGINX, three API replicas, Airflow and the monitoring stack.">
  <rect x="-24" y="-24" width="1184" height="568" fill="#ffffff"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#172033;font-size:15px}
    .sub{fill:#5a6680;font-size:12.5px}
    .zt{fill:#5a6680;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase}
    .lbl{fill:#5a6680;font-size:12px}
    .zone{fill:none;stroke:#b8c2d6;stroke-width:1.5;stroke-dasharray:6 5}
    .n{stroke-width:1.6}
    .ext{fill:#f3f5f9;stroke:#8a96ad}
    .dat{fill:#eef4ff;stroke:#3b7be0}
    .trn{fill:#f4f0ff;stroke:#7c5cd6}
    .srv{fill:#ecf8f1;stroke:#2f9e63}
    .mon{fill:#fff6e3;stroke:#c98a14}
    .ln{fill:none;stroke:#6b7a99;stroke-width:1.6}
  </style>
  <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#6b7a99"/>
      </marker>
    </defs>

    <!-- External services -->
    <rect class="n dat" x="0" y="34" width="170" height="64" rx="10"/>
    <text x="16" y="60">data.gouv.fr</text><text class="sub" x="16" y="81">BAAC CSVs</text>
    <path class="ln" d="M170 66 H212" marker-end="url(#ah)"/>

    <rect class="zone" x="200" y="0" width="450" height="120" rx="14"/>
    <text class="zt" x="216" y="22">GitHub</text>
    <rect class="n ext" x="216" y="34" width="128" height="68" rx="10"/>
    <text x="230" y="60">Actions</text><text class="sub" x="230" y="81">CI, release, ingest</text>
    <rect class="n ext" x="356" y="34" width="136" height="68" rx="10"/>
    <text x="370" y="60">Repository</text><text class="sub" x="370" y="81">main, data PRs</text>
    <rect class="n ext" x="504" y="34" width="130" height="68" rx="10"/>
    <text x="518" y="60">GHCR</text><text class="sub" x="518" y="81">Docker images</text>

    <rect class="zone" x="676" y="0" width="460" height="120" rx="14"/>
    <text class="zt" x="692" y="22">DagsHub</text>
    <rect class="n dat" x="692" y="34" width="190" height="68" rx="10"/>
    <text x="706" y="60">DVC storage</text><text class="sub" x="706" y="81">raw CSVs, versioned</text>
    <rect class="n dat" x="898" y="34" width="222" height="68" rx="10"/>
    <text x="912" y="60">MLflow</text><text class="sub" x="912" y="81">runs, registry, @production</text>

    <!-- Client -->
    <text class="zt" x="0" y="186">Client</text>
    <rect class="n ext" x="0" y="200" width="170" height="64" rx="10"/>
    <text x="16" y="226">Operators</text><text class="sub" x="16" y="247">emergency call centre</text>
    <rect class="n srv" x="0" y="320" width="170" height="64" rx="10"/>
    <text x="16" y="346">Call-centre app</text><text class="sub" x="16" y="367">built by developers</text>
    <path class="ln" d="M85 264 V316" marker-end="url(#ah)"/>
    <path class="ln" d="M170 352 H216" marker-end="url(#ah)"/>
    <text class="sub" x="0" y="408">HTTP + JWT token</text>

    <!-- Docker host -->
    <rect class="zone" x="200" y="160" width="936" height="350" rx="14"/>
    <text class="zt" x="220" y="186">Docker host</text>

    <rect class="n trn" x="220" y="200" width="180" height="64" rx="10"/>
    <text x="236" y="226">Airflow</text><text class="sub" x="236" y="247">ml_pipeline, drift · daily</text>
    <rect class="n trn" x="430" y="200" width="300" height="64" rx="10"/>
    <text x="446" y="226">Task containers</text><text class="sub" x="446" y="247">preprocess, train, promote, drift</text>
    <rect class="n mon" x="760" y="200" width="150" height="64" rx="10"/>
    <text x="776" y="226">Pushgateway</text><text class="sub" x="776" y="247">drift results</text>
    <path class="ln" d="M400 232 H426" marker-end="url(#ah)"/>
    <path class="ln" d="M730 232 H756" marker-end="url(#ah)"/>

    <rect class="n srv" x="220" y="320" width="150" height="64" rx="10"/>
    <text x="236" y="346">NGINX</text><text class="sub" x="236" y="367">single entry, :80</text>
    <rect class="n srv" x="408" y="328" width="162" height="64" rx="10"/>
    <rect class="n srv" x="404" y="324" width="162" height="64" rx="10"/>
    <rect class="n srv" x="400" y="320" width="162" height="64" rx="10"/>
    <text x="416" y="346">FastAPI x3</text><text class="sub" x="416" y="367">model in memory</text>
    <rect class="n srv" x="400" y="430" width="170" height="56" rx="10"/>
    <text x="416" y="452">SQLite</text><text class="sub" x="416" y="472">logged predictions</text>
    <rect class="n mon" x="760" y="320" width="150" height="64" rx="10"/>
    <text x="776" y="346">Prometheus</text><text class="sub" x="776" y="367">metrics</text>
    <rect class="n mon" x="940" y="320" width="140" height="64" rx="10"/>
    <text x="956" y="346">Grafana</text><text class="sub" x="956" y="367">dashboard</text>
    <path class="ln" d="M370 352 H396" marker-end="url(#ah)"/>
    <path class="ln" d="M570 352 H756" marker-end="url(#ah)"/>
    <text class="lbl" x="640" y="344">/metrics</text>
    <path class="ln" d="M835 264 V316" marker-end="url(#ah)"/>
    <path class="ln" d="M910 352 H936" marker-end="url(#ah)"/>
    <path class="ln" d="M480 392 V426" marker-end="url(#ah)"/>

    <!-- Flows between the host and GitHub / DagsHub -->
    <path class="ln" d="M470 102 V196" marker-end="url(#ah)"/>
    <text class="lbl" x="478" y="150">clone main</text>
    <path class="ln" d="M710 102 V196" marker-end="url(#ah)"/>
    <text class="lbl" x="718" y="180">dvc pull</text>
    <path class="ln" d="M569 102 V156" marker-end="url(#ah)"/>
    <text class="lbl" x="577" y="150">images</text>
    <path class="ln" d="M650 200 V140 H980 V106" marker-end="url(#ah)"/>
    <text class="lbl" x="760" y="134">log, register, promote</text>
    <path class="ln" d="M540 392 V410 H1100 V106" marker-end="url(#ah)"/>
    <text class="lbl" x="620" y="430">API loads the production model</text>

    <text class="sub" x="620" y="490">Docker Compose: make up, make airflow</text>
</svg>
