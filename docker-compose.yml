# Docker Compose - Local Orchestration
#
# MLflow tracking and the model registry are hosted on DagsHub, not run
# locally. Copy env.example to .env and fill in your own DagsHub
# credentials and a JWT signing key before starting (see README).

services:
  # Inference API: pulls models:/xgb_severity@production from DagsHub at startup
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Pinned like the other images, so names do not depend on the directory.
    image: baac-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Fallback model used only when the registry is unreachable
      - ./models:/app/models
      # User accounts must survive container recreation, so the SQLite file
      # lives on the host. It holds password hashes and is gitignored.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      # start_period covers the model pull from DagsHub (~10s, plus retries
      # on timeout) so the container is not reported unhealthy while starting.
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # Training: run on demand, not part of the default stack.
  # Usage: docker-compose --profile training run --rm training
  # Requires data/processed/, so run the dvc service below first.
  training:
    build:
      context: .
      dockerfile: docker/train.Dockerfile
    # Pinned so the name does not depend on the directory the repo sits in:
    # the Airflow DAG starts this image by name.
    image: baac-training:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    profiles:
      - training

  # DVC data versioning against the DagsHub remote. A one-shot command, not
  # a long-running service.
  # Usage: docker-compose --profile dvc run --rm dvc pull
  #        docker-compose --profile dvc run --rm dvc push
  #        docker-compose --profile dvc run --rm dvc status
  dvc:
    build:
      context: .
      dockerfile: docker/dvc.Dockerfile
    # Pinned for the same reason as the training image.
    image: baac-dvc:latest
    env_file:
      - .env
    volumes:
      # The whole repo: DVC needs .dvc/, dvc.yaml and dvc.lock, and writes
      # pulled data back to the host.
      - .:/app
    profiles:
      - dvc

  # Airflow: orchestrates the end-to-end pipeline (Phase 3).
  # Usage: docker-compose --profile airflow up -d   -> http://localhost:8080
  # Runs in standalone mode (scheduler, API server and a SQLite metadata
  # database in one container), which is enough to drive a manually
  # triggered pipeline locally.
  airflow:
    image: apache/airflow:3.3.1
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Absolute path of the repo on the host. The task containers are
      # siblings of this one, so their bind mounts are resolved by the host
      # daemon and a path inside this container would not exist.
      - HOST_PROJECT_DIR=${PWD}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      # Point the metadata database at the persisted subdirectory.
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/db/airflow.db
      - AIRFLOW__LOGGING__BASE_LOG_FOLDER=/opt/airflow/logs
    volumes:
      - ./dags:/opt/airflow/dags
      # Only the metadata database and logs are persisted. Mounting
      # /opt/airflow itself would mask the Airflow installation in the image.
      - ./airflow_data/db:/opt/airflow/db
      - ./airflow_data/logs:/opt/airflow/logs
      # Lets Airflow start the training and DVC containers on the host daemon.
      # This is a privileged access: anything Airflow runs can control Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    # Stay the image's own airflow user (Airflow lives in its ~/.local, which
    # root cannot import), but join the group owning the Docker socket so the
    # DockerOperator can reach it. 991 is the socket's group inside the Colima
    # VM: check with `ls -ln /var/run/docker.sock` if tasks fail on permission.
    user: "50000:0"
    group_add:
      - "991"
    command: standalone
    profiles:
      - airflow

  # Prometheus monitoring (Phase 4)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  # Grafana visualization (Phase 4)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring
