# Docker Compose - Local Orchestration
#
# MLflow tracking and the model registry are hosted on DagsHub, not run
# locally. Copy .env.example to .env and fill in your own DagsHub
# credentials before starting (see README).

services:
  # Inference API: pulls models:/xgb_severity@production from DagsHub at startup
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Fallback model used only when the registry is unreachable
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      # start_period covers the model pull from DagsHub (~10s, plus retries
      # on timeout) so the container is not reported unhealthy while starting.
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # Training: run on demand, not part of the default stack.
  # Usage: docker-compose run --rm training
  training:
    build:
      context: .
      dockerfile: docker/train.Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    profiles:
      - training

  # Prometheus monitoring (Phase 4)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  # Grafana visualization (Phase 4)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring
