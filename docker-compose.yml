# Docker Compose - Local Orchestration
#
# MLflow tracking and the model registry are hosted on DagsHub, not run
# locally. Copy env.example to .env and fill in your own DagsHub
# credentials and a JWT signing key before starting (see README).

# A fixed network name, independent of the directory the repo is cloned into:
# containers started by Airflow join it by name to reach the Pushgateway.
networks:
  default:
    name: baac

services:
  # Inference API: pulls models:/xgb_severity@production from DagsHub at startup
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # The image release.yml publishes on every merge to main. `docker-compose
    # build` still builds it locally under the same name for development.
    image: ghcr.io/hkayne1987/may26_cmlops_accidents/baac-api:latest
    labels:
      # Lets Watchtower (autoupdate profile) replace it with a newer release.
      - com.centurylinklabs.watchtower.enable=true
    # Pinned like the other images, so names do not depend on the directory.
    deploy:
      replicas: 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Fallback model used only when the registry is unreachable
      - ./models:/app/models
      # User accounts must survive container recreation, so the SQLite file
      # lives on the host. It holds password hashes and is gitignored.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      # start_period covers the model pull from DagsHub (~10s, plus retries
      # on timeout) so the container is not reported unhealthy while starting.
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: deployment/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

  # Training: run on demand, not part of the default stack.
  # Usage: docker compose --profile training run --rm training
  # Requires data/processed/, so run the dvc service below first.
  training:
    build:
      context: .
      dockerfile: docker/train.Dockerfile
    # Published by release.yml; the Airflow DAGs start it by this name.
    image: ghcr.io/hkayne1987/may26_cmlops_accidents/baac-training:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    profiles:
      - training

  # DVC data versioning against the DagsHub remote. A one-shot command, not
  # a long-running service.
  # Usage: docker compose --profile dvc run --rm dvc pull
  #        docker compose --profile dvc run --rm dvc push
  #        docker compose --profile dvc run --rm dvc status
  dvc:
    build:
      context: .
      dockerfile: docker/dvc.Dockerfile
    # Published by release.yml, like the training image.
    image: ghcr.io/hkayne1987/may26_cmlops_accidents/baac-dvc:latest
    env_file:
      - .env
    volumes:
      # The whole repo: DVC needs .dvc/, dvc.yaml and dvc.lock, and writes
      # pulled data back to the host.
      - .:/app
    profiles:
      - dvc

  # Airflow: orchestrates the end-to-end pipeline (Phase 3).
  # Usage: docker compose --profile airflow up -d   -> http://localhost:8080
  # Runs in standalone mode (scheduler, API server and a SQLite metadata
  # database in one container), which is enough to drive a manually
  # triggered pipeline locally.
  airflow:
    image: apache/airflow:3.3.1
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Absolute path of the repo on the host. The task containers are
      # siblings of this one, so their bind mounts are resolved by the host
      # daemon and a path inside this container would not exist.
      - HOST_PROJECT_DIR=${PWD}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      # Point the metadata database at the persisted subdirectory.
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/db/airflow.db
      - AIRFLOW__LOGGING__BASE_LOG_FOLDER=/opt/airflow/logs
    volumes:
      - ./dags:/opt/airflow/dags
      # Only the metadata database and logs are persisted. Mounting
      # /opt/airflow itself would mask the Airflow installation in the image.
      - ./airflow_data/db:/opt/airflow/db
      - ./airflow_data/logs:/opt/airflow/logs
      # Lets Airflow start the training and DVC containers on the host daemon.
      # This is a privileged access: anything Airflow runs can control Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    # Stay the image's own airflow user (Airflow lives in its ~/.local, which
    # root cannot import), but join the group owning the Docker socket so the
    # DockerOperator can reach it. 991 is the socket's group inside the Colima
    # VM: check with `ls -ln /var/run/docker.sock` if tasks fail on permission.
    user: "50000:0"
    group_add:
      - "991"
    command: standalone
    profiles:
      - airflow

  # Watchtower: keeps the running API on the latest image published by CI.
  # Checks GHCR every 5 minutes and recreates the api container when a new
  # baac-api:latest is out. Opt-in, because in development it would replace
  # an image just built locally with the published one.
  # Usage: docker compose --profile autoupdate up -d
  # nicholas-fedor's fork: the original containrrr/watchtower is archived.
  watchtower:
    image: nickfedor/watchtower:1.22.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only containers labelled com.centurylinklabs.watchtower.enable=true.
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      # Remove the replaced image so old releases do not pile up on disk.
      - WATCHTOWER_CLEANUP=true
    profiles:
      - autoupdate

  # Prometheus monitoring (Phase 4). Scrapes the API's /metrics over the
  # Docker network, see deployment/prometheus/prometheus.yml.
  # Usage: docker compose --profile monitoring up -d   -> http://localhost:9090
  prometheus:
    # Pinned rather than latest, like every other image in this stack.
    image: prom/prometheus:v3.13.2
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  # Pushgateway: where batch jobs such as drift detection leave their results
  # for Prometheus, since a job that exits cannot be scraped itself.
  pushgateway:
    image: prom/pushgateway:v1.11.3
    ports:
      - "9091:9091"
    profiles:
      - monitoring

  # Drift detection on demand: compares logged predictions with the training
  # data and pushes the result to the Pushgateway. Airflow runs the same
  # command daily (dags/drift_monitoring.py).
  # Usage: docker compose --profile drift run --rm drift
  drift:
    image: ghcr.io/hkayne1987/may26_cmlops_accidents/baac-training:latest
    command: ["uv", "run", "python", "-m", "src.monitoring.detection"]
    env_file:
      - .env
    environment:
      - PUSHGATEWAY_URL=http://pushgateway:9091
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    profiles:
      - drift

  # Grafana visualization (Phase 4). The Prometheus data source and the API
  # dashboard are provisioned from deployment/grafana/, nothing to click.
  # -> http://localhost:3000 (admin / GRAFANA_PASSWORD)
  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring
